<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ecommerce Store</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">
        <!-- Logo & Branding -->
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
            <i class="fa-solid fa-bag-shopping fa-2x text-primary"></i>
            <span class="fs-3 fw-bold text-dark">Ecommerce Store</span>
          </a>
          <p class="text-muted small">Sign in to access your account & orders</p>
        </div>

        <!-- Login Card -->
        <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4">
          <h4 class="fw-bold mb-3 text-center">Welcome Back</h4>

          <div id="login-alert" class="alert alert-danger py-2 small d-none"></div>

          <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-regular fa-user text-muted"></i></span>
                <input type="text" id="login-identifier" class="form-control" placeholder="admin or user@example.com" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label fw-semibold small">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('login-password')">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">
              <span class="spinner-border spinner-border-sm me-2 d-none" id="login-spinner"></span>
              Sign In
            </button>
          </form>

          <div class="text-center mt-4 text-muted small">
            Don't have an account? <a href="register.html" class="fw-semibold text-primary text-decoration-none">Create Account</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-muted small text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i> Return to Home
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePasswordVisibility(fieldId) {
      const input = document.getElementById(fieldId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('login-submit-btn');
      const spinner = document.getElementById('login-spinner');

      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const result = await Auth.login(identifier, password);
        if (result.success) {
          showToast(`Welcome back, ${result.user.full_name || result.user.username}!`, "success");

          // Check redirect param
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');

          setTimeout(() => {
            if (redirect && !redirect.includes('login.html')) {
              window.location.href = redirect;
            } else if (result.user.role === 'ADMIN' || result.user.is_admin) {
              window.location.href = 'admin/dashboard.html';
            } else {
              window.location.href = 'products.html';
            }
          }, 600);
        } else {
          alertBox.textContent = result.error || "Login failed. Please check your credentials.";
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = err.message || "An error occurred during login.";
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
