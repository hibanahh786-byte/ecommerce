<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account - Ecommerce Store</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
            <i class="fa-solid fa-bag-shopping fa-2x text-primary"></i>
            <span class="fs-3 fw-bold text-dark">Ecommerce Store</span>
          </a>
          <p class="text-muted small">Create your customer account to start shopping</p>
        </div>

        <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4">
          <h4 class="fw-bold mb-3 text-center">Create New Account</h4>

          <div id="register-alert" class="alert alert-danger py-2 small d-none"></div>

          <form id="register-form" onsubmit="handleRegister(event)">
            <div class="mb-3">
              <label class="form-label fw-semibold small">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-regular fa-id-card text-muted"></i></span>
                <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Jane Smith" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-regular fa-user text-muted"></i></span>
                <input type="text" id="reg-username" class="form-control" placeholder="e.g. janesmith" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-regular fa-envelope text-muted"></i></span>
                <input type="email" id="reg-email" class="form-control" placeholder="jane@example.com" required>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <label class="form-label fw-semibold small">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                  <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
                </div>
              </div>
              <div class="col-sm-6">
                <label class="form-label fw-semibold small">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                  <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" minlength="6" required>
                </div>
              </div>
            </div>

            <button type="submit" id="reg-submit-btn" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">
              <span class="spinner-border spinner-border-sm me-2 d-none" id="reg-spinner"></span>
              Register
            </button>
          </form>

          <div class="text-center mt-4 text-muted small">
            Already have an account? <a href="login.html" class="fw-semibold text-primary text-decoration-none">Sign In</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-muted small text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i> Return to Home
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('reg-fullname').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;
      const alertBox = document.getElementById('register-alert');
      const submitBtn = document.getElementById('reg-submit-btn');
      const spinner = document.getElementById('reg-spinner');

      alertBox.classList.add('d-none');

      if (password !== confirmPassword) {
        alertBox.textContent = "Passwords do not match.";
        alertBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const result = await Auth.register({
          full_name: fullName,
          username: username,
          email: email,
          password: password,
          confirm_password: confirmPassword
        });

        if (result.success) {
          showToast("Registration successful! Logging you in...", "success");
          // Automatically log the new user in
          const loginRes = await Auth.login(username, password);
          if (loginRes.success) {
            setTimeout(() => {
              window.location.href = 'products.html';
            }, 800);
          } else {
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1000);
          }
        } else {
          alertBox.textContent = result.error || "Registration failed.";
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = err.message || "An unexpected error occurred.";
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
