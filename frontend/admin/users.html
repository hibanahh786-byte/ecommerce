<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - ApexStore Admin</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <main class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <div class="admin-content">
        <!-- Controls Bar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div class="d-flex align-items-center gap-2" style="max-width: 350px; flex: 1;">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="user-search-input" class="form-control border-start-0" placeholder="Filter users by name or email..." oninput="handleSearch()">
            </div>
          </div>

          <button class="btn btn-outline-primary btn-sm" onclick="loadUsers()">
            <i class="fa-solid fa-rotate me-1"></i> Refresh Users
          </button>
        </div>

        <!-- Users Table Card -->
        <div class="admin-table-card">
          <div class="table-responsive">
            <table class="table admin-table align-middle">
              <thead>
                <tr>
                  <th style="width: 70px;">ID</th>
                  <th>Full Name</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Assigned Role</th>
                  <th>Registered On</th>
                  <th class="text-center">Orders Placed</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Loading registered users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    let allUsers = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!AdminLayout.init('users', 'User Roster')) return;
      await loadUsers();
    });

    async function loadUsers() {
      const tbody = document.getElementById('users-tbody');
      try {
        const res = await apiRequest('/users/');
        allUsers = res.data || [];
        renderUsers(allUsers);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${err.message}</td></tr>`;
      }
    }

    function renderUsers(usersList) {
      const tbody = document.getElementById('users-tbody');
      if (usersList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No users found.</td></tr>';
        return;
      }

      tbody.innerHTML = usersList.map(u => {
        const roleBadge = (u.role === 'ADMIN' || u.is_staff)
          ? '<span class="badge bg-danger rounded-pill px-3 py-1"><i class="fa-solid fa-shield-halved me-1"></i> ADMIN</span>'
          : '<span class="badge bg-primary rounded-pill px-3 py-1"><i class="fa-solid fa-user me-1"></i> USER</span>';

        return `
          <tr>
            <td class="fw-bold text-secondary">#${u.id}</td>
            <td class="fw-semibold text-dark">${u.full_name || '-'}</td>
            <td><code>${u.username}</code></td>
            <td><a href="mailto:${u.email}" class="text-decoration-none">${u.email}</a></td>
            <td>${roleBadge}</td>
            <td>${formatDate(u.date_joined)}</td>
            <td class="text-center">
              <span class="badge bg-light text-dark border px-2 py-1 rounded-pill">
                ${u.orders_count || 0} orders
              </span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function handleSearch() {
      const query = document.getElementById('user-search-input').value.toLowerCase().trim();
      const filtered = allUsers.filter(u => 
        (u.username && u.username.toLowerCase().includes(query)) ||
        (u.email && u.email.toLowerCase().includes(query)) ||
        (u.full_name && u.full_name.toLowerCase().includes(query))
      );
      renderUsers(filtered);
    }
  </script>
</body>
</html>
