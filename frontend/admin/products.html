<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management - Ecommerce Store Admin</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <main class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <div class="admin-content">
        <!-- Controls Bar -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div class="d-flex flex-wrap align-items-center gap-2" style="flex: 1; max-width: 600px;">
            <!-- Search -->
            <div class="input-group" style="min-width: 240px; flex: 1;">
              <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="product-search-input" class="form-control border-start-0" placeholder="Search by name..." oninput="handleSearch()">
            </div>

            <!-- Category Filter Dropdown -->
            <select id="product-category-filter" class="form-select" style="max-width: 200px;" onchange="loadProducts()">
              <option value="">All Categories</option>
            </select>
          </div>

          <button class="btn btn-primary" onclick="openAddProductModal()">
            <i class="fa-solid fa-plus me-1"></i> Add Product
          </button>
        </div>

        <!-- Products Table Card -->
        <div class="admin-table-card">
          <div class="table-responsive">
            <table class="table admin-table align-middle">
              <thead>
                <tr>
                  <th style="width: 70px;">Image</th>
                  <th>Product Details</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock Quantity</th>
                  <th>Date Added</th>
                  <th class="text-end" style="width: 150px;">Actions</th>
                </tr>
              </thead>
              <tbody id="products-tbody">
                <tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Loading products...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow-lg">
        <form id="product-form" onsubmit="saveProduct(event)">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="product-modal-title">Add Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <input type="hidden" id="product-id-hidden">

            <div class="row g-3">
              <!-- Name -->
              <div class="col-12">
                <label class="form-label fw-semibold">Product Name</label>
                <input type="text" id="prod-name-input" class="form-control" placeholder="e.g. Wireless Noise Cancelling Headphones" required>
              </div>

              <!-- Category -->
              <div class="col-md-6">
                <label class="form-label fw-semibold">Category</label>
                <select id="prod-category-select" class="form-select" required>
                  <option value="" disabled selected>Select Category</option>
                </select>
              </div>

              <!-- Price -->
              <div class="col-md-3">
                <label class="form-label fw-semibold">Price (₹)</label>
                <input type="number" id="prod-price-input" class="form-control" step="0.01" min="0.01" placeholder="999.00" required>
              </div>

              <!-- Stock Quantity -->
              <div class="col-md-3">
                <label class="form-label fw-semibold">Stock Quantity</label>
                <input type="number" id="prod-stock-input" class="form-control" min="0" placeholder="25" required>
              </div>

              <!-- Image Upload & Preview -->
              <div class="col-12 mt-3">
                <label class="form-label fw-semibold">Product Image</label>
                <input type="file" id="prod-image-file" class="form-control" accept="image/*" onchange="previewImage(this)">
                <div class="form-text">Supported formats: JPG, PNG, WEBP, GIF (Max size 5MB).</div>
              </div>

              <!-- Image Preview Box -->
              <div class="col-12">
                <div class="p-3 border rounded-3 bg-light text-center" id="image-preview-wrapper" style="min-height: 140px;">
                  <img id="image-preview" src="" alt="Preview" class="rounded-3 shadow-sm d-none" style="max-height: 180px; max-width: 100%; object-fit: contain;">
                  <div id="image-preview-placeholder" class="text-muted small py-4">
                    <i class="fa-regular fa-image fa-2x mb-2 d-block"></i>
                    No image chosen yet
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary px-4" id="product-save-btn">
              <span class="spinner-border spinner-border-sm me-2 d-none" id="product-spinner"></span>
              Save Product
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Product Modal -->
  <div class="modal fade" id="deleteProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-danger"><i class="fa-solid fa-trash-can me-2"></i>Delete Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete <strong id="delete-prod-name"></strong>?</p>
          <div class="alert alert-warning py-2 small mb-0">
            This action removes the product from the catalog.
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger px-4" id="confirm-delete-prod-btn" onclick="executeDeleteProduct()">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    let productModalObj = null;
    let deleteProductModalObj = null;
    let productToDeleteId = null;
    let categoriesList = [];
    let searchTimeout = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!AdminLayout.init('products', 'Product Management')) return;
      productModalObj = new bootstrap.Modal(document.getElementById('productModal'));
      deleteProductModalObj = new bootstrap.Modal(document.getElementById('deleteProductModal'));

      await loadCategoryOptions();
      await loadProducts();

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'new') {
        openAddProductModal();
      }
    });

    async function loadCategoryOptions() {
      try {
        const res = await apiRequest('/categories/');
        categoriesList = res.data || [];

        const filterSelect = document.getElementById('product-category-filter');
        const modalSelect = document.getElementById('prod-category-select');

        const optionsHtml = categoriesList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        filterSelect.innerHTML = '<option value="">All Categories</option>' + optionsHtml;
        modalSelect.innerHTML = '<option value="" disabled selected>Select Category</option>' + optionsHtml;
      } catch (err) {
        console.error("Failed to load categories for select:", err);
      }
    }

    async function loadProducts() {
      const tbody = document.getElementById('products-tbody');
      const search = document.getElementById('product-search-input').value.trim();
      const catId = document.getElementById('product-category-filter').value;

      let query = [];
      if (catId) query.push(`category=${catId}`);
      if (search) query.push(`search=${encodeURIComponent(search)}`);

      const endpoint = `/products/${query.length > 0 ? '?' + query.join('&') : ''}`;

      try {
        const res = await apiRequest(endpoint);
        const products = res.data || [];

        if (products.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No products found.</td></tr>';
          return;
        }

        tbody.innerHTML = products.map(p => {
          const imgUrl = p.image_url || API_CONFIG.MEDIA_FALLBACK;
          const isOutOfStock = p.stock <= 0;
          const stockBadge = isOutOfStock
            ? '<span class="badge bg-danger">Out of Stock (0)</span>'
            : `<span class="badge ${p.stock < 10 ? 'bg-warning text-dark' : 'bg-success'}">${p.stock} in stock</span>`;

          return `
            <tr>
              <td>
                <img src="${imgUrl}" alt="${p.name}" class="table-thumbnail" onerror="this.src='${API_CONFIG.MEDIA_FALLBACK}'">
              </td>
              <td>
                <div class="fw-bold text-dark">${p.name}</div>
                <small class="text-muted">ID: #${p.id}</small>
              </td>
              <td>
                <span class="badge bg-light text-dark border">${p.category ? p.category.name : 'None'}</span>
              </td>
              <td class="fw-bold text-primary">${formatPrice(p.price)}</td>
              <td>${stockBadge}</td>
              <td>${formatDate(p.created_at)}</td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary me-1" onclick='openEditProductModal(${JSON.stringify(p)})'>
                  <i class="fa-regular fa-pen-to-square"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick='promptDeleteProduct(${p.id}, "${p.name.replace(/"/g, '&quot;')}")'>
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${err.message}</td></tr>`;
      }
    }

    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        loadProducts();
      }, 300);
    }

    function previewImage(input) {
      const previewImg = document.getElementById('image-preview');
      const placeholder = document.getElementById('image-preview-placeholder');

      if (input.files && input.files[0]) {
        const file = input.files[0];
        // Validate max 5MB
        if (file.size > 5 * 1024 * 1024) {
          showToast("Image size must be less than 5MB.", "error");
          input.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          previewImg.src = e.target.result;
          previewImg.classList.remove('d-none');
          placeholder.classList.add('d-none');
        };
        reader.readAsDataURL(file);
      }
    }

    function openAddProductModal() {
      document.getElementById('product-modal-title').textContent = 'Add New Product';
      document.getElementById('product-id-hidden').value = '';
      document.getElementById('prod-name-input').value = '';
      document.getElementById('prod-category-select').value = '';
      document.getElementById('prod-price-input').value = '';
      document.getElementById('prod-stock-input').value = '';
      document.getElementById('prod-image-file').value = '';

      document.getElementById('image-preview').src = '';
      document.getElementById('image-preview').classList.add('d-none');
      document.getElementById('image-preview-placeholder').classList.remove('d-none');

      productModalObj.show();
    }

    function openEditProductModal(p) {
      document.getElementById('product-modal-title').textContent = 'Edit Product';
      document.getElementById('product-id-hidden').value = p.id;
      document.getElementById('prod-name-input').value = p.name;
      document.getElementById('prod-category-select').value = p.category ? p.category.id : '';
      document.getElementById('prod-price-input').value = p.price;
      document.getElementById('prod-stock-input').value = p.stock;
      document.getElementById('prod-image-file').value = '';

      const previewImg = document.getElementById('image-preview');
      const placeholder = document.getElementById('image-preview-placeholder');

      if (p.image_url) {
        previewImg.src = p.image_url;
        previewImg.classList.remove('d-none');
        placeholder.classList.add('d-none');
      } else {
        previewImg.src = '';
        previewImg.classList.add('d-none');
        placeholder.classList.remove('d-none');
      }

      productModalObj.show();
    }

    async function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('product-id-hidden').value;
      const name = document.getElementById('prod-name-input').value.trim();
      const categoryId = document.getElementById('prod-category-select').value;
      const price = document.getElementById('prod-price-input').value;
      const stock = document.getElementById('prod-stock-input').value;
      const imageFile = document.getElementById('prod-image-file').files[0];

      const formData = new FormData();
      formData.append('name', name);
      formData.append('category_id', categoryId);
      formData.append('price', price);
      formData.append('stock', stock);
      if (imageFile) {
        formData.append('image', imageFile);
      }

      const btn = document.getElementById('product-save-btn');
      const spinner = document.getElementById('product-spinner');

      try {
        btn.disabled = true;
        spinner.classList.remove('d-none');

        if (id) {
          // Update product
          await apiRequest(`/products/${id}/`, {
            method: 'PUT',
            body: formData
          });
          showToast("Product updated successfully!", "success");
        } else {
          // Create product
          await apiRequest('/products/', {
            method: 'POST',
            body: formData
          });
          showToast("Product created successfully!", "success");
        }

        productModalObj.hide();
        await loadProducts();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    }

    function promptDeleteProduct(id, name) {
      productToDeleteId = id;
      document.getElementById('delete-prod-name').textContent = name;
      deleteProductModalObj.show();
    }

    async function executeDeleteProduct() {
      if (!productToDeleteId) return;
      const btn = document.getElementById('confirm-delete-prod-btn');
      try {
        btn.disabled = true;
        await apiRequest(`/products/${productToDeleteId}/`, {
          method: 'DELETE'
        });
        showToast("Product deleted successfully!", "success");
        deleteProductModalObj.hide();
        await loadProducts();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        productToDeleteId = null;
      }
    }
  </script>
</body>
</html>
