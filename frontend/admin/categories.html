<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management - Ecommerce Store Admin</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <main class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <div class="admin-content">
        <!-- Control Header -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div class="d-flex align-items-center gap-2" style="max-width: 350px; flex: 1;">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="category-search-input" class="form-control border-start-0" placeholder="Search categories..." oninput="handleSearch()">
            </div>
          </div>

          <button class="btn btn-primary" onclick="openAddCategoryModal()">
            <i class="fa-solid fa-plus me-1"></i> Add Category
          </button>
        </div>

        <!-- Categories Table Card -->
        <div class="admin-table-card">
          <div class="table-responsive">
            <table class="table admin-table align-middle">
              <thead>
                <tr>
                  <th style="width: 80px;">ID</th>
                  <th>Category Name</th>
                  <th>Assigned Products</th>
                  <th>Created Date</th>
                  <th class="text-end" style="width: 160px;">Actions</th>
                </tr>
              </thead>
              <tbody id="categories-tbody">
                <tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Loading categories...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Category Modal -->
  <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <form id="category-form" onsubmit="saveCategory(event)">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="category-modal-title">Add Category</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="category-id-hidden">
            <div class="mb-3">
              <label class="form-label fw-semibold">Category Name</label>
              <input type="text" id="category-name-input" class="form-control" placeholder="e.g. Smart Wearables" required>
              <div class="form-text">Must be a unique descriptive name.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary px-4" id="category-save-btn">
              <span class="spinner-border spinner-border-sm me-2 d-none" id="category-spinner"></span>
              Save Category
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-danger"><i class="fa-solid fa-triangle-exclamation me-2"></i>Delete Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete <strong id="delete-category-name"></strong>?</p>
          <div class="alert alert-warning py-2 small mb-0">
            <i class="fa-solid fa-circle-exclamation me-1"></i> Warning: Deleting this category will delete all products assigned to it!
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger px-4" id="confirm-delete-btn" onclick="executeDeleteCategory()">
            Delete Category
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    let categoryModalObj = null;
    let deleteConfirmModalObj = null;
    let categoryToDeleteId = null;
    let searchTimeout = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!AdminLayout.init('categories', 'Category Management')) return;
      categoryModalObj = new bootstrap.Modal(document.getElementById('categoryModal'));
      deleteConfirmModalObj = new bootstrap.Modal(document.getElementById('deleteConfirmModal'));

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'new') {
        openAddCategoryModal();
      }

      await loadCategories();
    });

    async function loadCategories(search = '') {
      const tbody = document.getElementById('categories-tbody');
      try {
        const endpoint = `/categories/${search ? '?search=' + encodeURIComponent(search) : ''}`;
        const res = await apiRequest(endpoint);
        const categories = res.data || [];

        if (categories.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No categories found.</td></tr>';
          return;
        }

        tbody.innerHTML = categories.map(cat => `
          <tr>
            <td class="fw-bold text-secondary">#${cat.id}</td>
            <td class="fw-semibold text-dark fs-6">${cat.name}</td>
            <td>
              <span class="badge bg-light text-dark border px-2 py-1 rounded-pill">
                <i class="fa-solid fa-box me-1 text-primary"></i> ${cat.products_count} products
              </span>
            </td>
            <td>${formatDate(cat.created_at)}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-1" onclick='openEditCategoryModal(${JSON.stringify(cat)})'>
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick='promptDeleteCategory(${cat.id}, "${cat.name.replace(/"/g, '&quot;')}")'>
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${err.message}</td></tr>`;
      }
    }

    function handleSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = document.getElementById('category-search-input').value.trim();
        loadCategories(query);
      }, 300);
    }

    function openAddCategoryModal() {
      document.getElementById('category-modal-title').textContent = 'Add Category';
      document.getElementById('category-id-hidden').value = '';
      document.getElementById('category-name-input').value = '';
      categoryModalObj.show();
    }

    function openEditCategoryModal(cat) {
      document.getElementById('category-modal-title').textContent = 'Edit Category';
      document.getElementById('category-id-hidden').value = cat.id;
      document.getElementById('category-name-input').value = cat.name;
      categoryModalObj.show();
    }

    async function saveCategory(e) {
      e.preventDefault();
      const id = document.getElementById('category-id-hidden').value;
      const name = document.getElementById('category-name-input').value.trim();
      const btn = document.getElementById('category-save-btn');
      const spinner = document.getElementById('category-spinner');

      try {
        btn.disabled = true;
        spinner.classList.remove('d-none');

        if (id) {
          // Update
          await apiRequest(`/categories/${id}/`, {
            method: 'PUT',
            body: { name }
          });
          showToast("Category updated successfully!", "success");
        } else {
          // Create
          await apiRequest('/categories/', {
            method: 'POST',
            body: { name }
          });
          showToast("Category created successfully!", "success");
        }

        categoryModalObj.hide();
        await loadCategories();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    }

    function promptDeleteCategory(id, name) {
      categoryToDeleteId = id;
      document.getElementById('delete-category-name').textContent = name;
      deleteConfirmModalObj.show();
    }

    async function executeDeleteCategory() {
      if (!categoryToDeleteId) return;
      const btn = document.getElementById('confirm-delete-btn');
      try {
        btn.disabled = true;
        await apiRequest(`/categories/${categoryToDeleteId}/`, {
          method: 'DELETE'
        });
        showToast("Category deleted successfully!", "success");
        deleteConfirmModalObj.hide();
        await loadCategories();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        categoryToDeleteId = null;
      }
    }
  </script>
</body>
</html>
